<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OpenPip</title>
  <script>(function(){var m=localStorage.getItem("openpip-mode")||"system";var isDark=m==="system"?window.matchMedia("(prefers-color-scheme:dark)").matches:m==="dark";document.documentElement.setAttribute("data-theme",isDark?"dark":"light");var a=localStorage.getItem("openpip-accent");if(a)document.documentElement.setAttribute("data-accent",a);}());</script>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app-header.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    :root { --ink:var(--color-text); --muted:var(--color-text-muted); --line:var(--color-border); --coral:var(--color-accent); --coral-dark:var(--color-accent-dark); --blush:var(--color-accent-light); --sand:var(--color-bg); --card:var(--color-surface); --mint:#dff7e9; --gold:#fff1c9; --blue:#e6f3ff; --shadow:var(--shadow-lg); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--sand); color:var(--ink); font-family:Nunito, ui-rounded, "Avenir Next", system-ui, sans-serif; }
    button, input, textarea { font:inherit; }
    button { cursor:pointer; }
    .login { min-height:100vh; display:grid; place-items:center; background:var(--color-bg); padding:16px; }
    .login-form { width:100%; display:flex; align-items:center; justify-content:center; }
    .form-inner { width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; gap:0; padding:40px 32px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:24px; box-shadow:var(--shadow-lg); }
    .login-mascot { width:80px; height:80px; overflow:hidden; border-radius:50%; background:#ffe2dc; }
    .login-mascot img { width:100%; height:100%; object-fit:cover; }
    .wordmark { display:flex; align-items:center; gap:10px; color:var(--coral); font-weight:900; font-size:1.35rem; letter-spacing:-.04em; }
    .wordmark .mini { width:34px; height:34px; border-radius:12px; overflow:hidden; background:#ffe2dc; }
    .wordmark img { width:100%; height:100%; object-fit:cover; }
    .form-inner h2 { margin:8px 0 24px; font-size:var(--font-size-2xl); font-weight:800; letter-spacing:-.02em; color:var(--color-accent); }
    .login-intro { text-align:center; margin:0 0 15px; } .login-intro strong { display:block; font-size:.88rem; color:var(--muted); } .login-intro span { display:block; color:var(--muted); font-size:.75rem; margin-top:4px; line-height:1.6; }
    label { align-self:stretch; display:block; font-size:.84rem; font-weight:800; margin:12px 0 7px; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:14px; background:var(--color-bg); color:var(--color-text); padding:13px 14px; outline:none; }
    input:focus, textarea:focus { border-color:var(--coral); box-shadow:0 0 0 3px rgba(244,117,96,.12); }
    .primary { border:0; border-radius:999px; background:var(--coral); color:#fff; padding:13px 19px; font-weight:900; box-shadow:0 7px 15px rgba(211,89,68,.2); }
    .primary:hover { background:var(--coral-dark); }
    .login .primary { width:100%; margin-top:22px; background:var(--color-surface); border:1px solid var(--color-border); box-shadow:none; color:var(--color-text); padding:12px 20px; font-weight:800; }
    .login .primary:hover { background:var(--color-bg); box-shadow:var(--shadow-md); color:var(--color-text); transform:translateY(-1px); }
    .hint, .error { font-size:.8rem; color:var(--muted); margin-top:14px; line-height:1.4; }
    .error { color:#bd4939; min-height:1.2em; }
    .app { display:none; min-height:100vh; }
    .topbar { height:72px; background:var(--color-surface); border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 clamp(20px,5vw,72px); position:sticky; top:0; z-index:10; }
    .date { color:var(--muted); font-size:.92rem; }
    .user { justify-self:end; display:flex; align-items:center; gap:10px; border:0; background:transparent; color:var(--ink); padding:5px; font-weight:800; }
    .avatar { display:grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--color-accent-light); color:var(--color-accent); font-size:.78rem; font-weight:700; border:2px solid var(--color-border); box-shadow:none; }
    .page { width:min(1200px, calc(100% - 40px)); margin:0 auto; padding:32px 0 100px; }
    .eyebrow { color:var(--coral); font-size:.75rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    h1 { letter-spacing:-.045em; font-size:clamp(1.8rem,4vw,2.8rem); margin:6px 0 7px; }
    .sub { color:var(--muted); margin:0 0 26px; line-height:1.5; }
    .brief { position:relative; overflow:hidden; background:var(--blush); border:1px solid #ffd8d0; border-left:5px solid var(--coral); border-radius:18px; padding:20px 22px; box-shadow:var(--shadow); }
    .brief h2, .card h2 { font-size:1.05rem; margin:0 0 10px; letter-spacing:-.025em; }
    .brief p { margin:0; line-height:1.55; }
    .brief ul { margin:12px 0 0; padding-left:19px; line-height:1.65; }
    .tts { position:absolute; top:16px; right:16px; border:0; background:transparent; color:#847d78; padding:6px; font-size:1rem; }
    .grid { display:grid; gap:18px; margin-top:18px; }
    .dashboard-grid { grid-template-columns:1.25fr 1fr 1fr; }
    .card { position:relative; text-align:left; background:var(--color-surface); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 3px 9px rgba(45,31,24,.05); }
    button.card:hover { border-color:var(--color-accent); transform:translateY(-1px); box-shadow:var(--shadow); }
    .card.large { min-height:260px; background:var(--color-surface); }
    .card h3 { margin:14px 0 7px; font-size:1.45rem; letter-spacing:-.04em; }
    .card p { color:var(--muted); margin:0; line-height:1.45; }
    .arrow { position:absolute; top:20px; right:20px; color:#9e9691; font-size:1.2rem; }
    .badge { display:inline-flex; align-items:center; gap:5px; background:var(--blush); color:var(--coral-dark); border-radius:999px; padding:4px 9px; font-size:.74rem; font-weight:900; }
    .badge.green { background:var(--mint); color:#20855a; } .badge.gold { background:var(--gold); color:#9e7312; } .badge.blue { background:var(--blue); color:#2876a9; }
    .item-list { margin:20px 0 0; display:grid; gap:11px; }
    .tiny-item { display:flex; align-items:center; gap:10px; font-size:.9rem; }
    .dot { width:9px; height:9px; border-radius:99px; background:#d178e6; flex:none; } .dot.gold { background:#efb407; } .dot.mint { background:#3fcf96; } .dot.coral { background:var(--coral); }
    .meta { color:var(--muted); font-size:.8rem; margin-left:auto; }
    .agent-launch { position:fixed; z-index:11; bottom:25px; left:50%; transform:translateX(-50%); width:min(580px,calc(100% - 40px)); border:0; background:var(--coral); color:#fff; padding:16px 24px; border-radius:999px; box-shadow:0 10px 30px rgba(204,82,63,.26); font-weight:900; }
    .agent-launch:hover { background:var(--coral-dark); }
    .agent-launch .pulse { display:inline-block; width:10px; height:10px; border:2px solid #fff; border-radius:50%; margin-right:8px; vertical-align:-1px; }
    .list-card { padding:0; overflow:hidden; }
    .row { display:flex; width:100%; gap:14px; align-items:center; text-align:left; border:0; border-bottom:1px solid var(--line); background:var(--color-surface); padding:18px 20px; color:var(--color-text); }
    .row:last-child { border-bottom:0; } .row:hover { background:var(--color-accent-light); }
    .row-main { min-width:0; } .row-title { display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-weight:900; } .row-sub { color:var(--muted); font-size:.87rem; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-right { margin-left:auto; text-align:right; color:var(--muted); font-size:.8rem; white-space:nowrap; }
    .initial { display:grid; place-items:center; width:40px; height:40px; border-radius:50%; background:var(--color-accent-light); border:1px solid var(--color-border); color:var(--color-accent); font-weight:900; flex:none; }
    .back { border:0; color:#756c67; background:transparent; padding:0; font-weight:800; margin-bottom:18px; }
    .detail-grid { display:grid; grid-template-columns:1.35fr .85fr; gap:18px; }
    .section { background:var(--color-surface); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 3px 9px rgba(45,31,24,.04); }
    .section h2 { font-size:1.05rem; margin:0 0 12px; }
    .section p { line-height:1.55; margin:0; }
    .fact { display:flex; padding:13px 0; border-bottom:1px solid var(--line); gap:15px; } .fact:last-child { border-bottom:0; } .fact span { color:var(--muted); } .fact strong { margin-left:auto; text-align:right; }
    .source-link { display:block; border-radius:12px; background:var(--color-accent-light); border:1px solid var(--color-border); padding:12px; color:var(--color-accent); font-size:.88rem; font-weight:800; text-decoration:none; margin-top:11px; }
    .approval { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; } .secondary { background:var(--color-surface); border:1px solid var(--line); border-radius:999px; padding:12px 17px; font-weight:900; color:var(--color-text-muted); }
    .notice { margin-top:16px; padding:12px 14px; background:var(--mint); color:#1a7950; border-radius:12px; font-size:.88rem; line-height:1.4; }
    .empty { border:1px dashed var(--color-border); border-radius:18px; color:var(--muted); text-align:center; padding:42px 20px; background:var(--color-surface); }
    .plan-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .tool-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .tool-card { min-height:125px; }
    .icon { display:grid; place-items:center; width:34px; height:34px; border-radius:11px; background:var(--blush); color:var(--coral-dark); font-size:1.05rem; }
    .overlay { position:fixed; z-index:30; inset:0; padding:20px; background:rgba(0,0,0,.5); display:none; place-items:center; backdrop-filter:blur(2px); }
    .overlay.open { display:grid; } .modal { width:min(720px,100%); max-height:min(760px,calc(100vh - 40px)); overflow:hidden; display:flex; flex-direction:column; background:var(--color-surface); border-radius:24px; box-shadow:0 30px 80px rgba(40,24,18,.3); }
    .modal-head { position:sticky; top:0; display:flex; align-items:center; gap:12px; background:var(--color-surface); padding:19px 22px; border-bottom:1px solid var(--line); z-index:1; }
    .modal-head h2 { font-size:1.2rem; margin:0; } .close { border:0; background:transparent; margin-left:auto; font-size:1.7rem; color:#827a75; }
    .chat { display:grid; grid-template-rows:1fr auto; flex:1; min-height:0; background:var(--color-surface); }
    .messages { padding:22px; display:grid; align-content:end; gap:14px; overflow:auto; background:var(--color-bg); }
    .bubble { width:fit-content; max-width:min(83%,560px); padding:13px 15px; border-radius:17px 17px 17px 5px; background:var(--color-accent-light); line-height:1.5; }
    .bubble.me { justify-self:end; border-radius:17px 17px 5px 17px; background:var(--color-accent); color:#fff; }
    .chat-form { display:flex; gap:9px; padding:13px 18px 18px; border-top:1px solid var(--line); background:var(--color-surface); }
    .chat-form input { min-width:0; background:var(--color-bg); color:var(--color-text); } .send { border:0; border-radius:14px; min-width:48px; background:var(--color-accent); color:#fff; font-size:1.15rem; }
    .voice { border:1px solid var(--line); border-radius:14px; min-width:46px; background:var(--color-surface); color:var(--muted); font-size:1rem; } .voice:disabled { cursor:not-allowed; opacity:.45; text-decoration:line-through; }
    .mode-grid { padding:20px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .mode-grid button { min-height:110px; text-align:left; }
    .toast { position:fixed; z-index:50; bottom:93px; left:50%; transform:translateX(-50%); background:#312c29; color:#fff; padding:12px 16px; border-radius:12px; box-shadow:var(--shadow); font-size:.88rem; display:none; }
    .toast.show { display:block; }
    /* The dashboard below intentionally copies the product dashboard layout: one full brief,
       one primary Today card, two outcome cards, and a voice-first talk bar. */
    .product-grid { display:grid; grid-template-columns:1fr; gap:16px; max-width:860px; margin:0 auto; width:100%; }
    .product-card { background:var(--color-surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1); color:var(--ink); display:flex; flex-direction:column; gap:12px; min-width:0; overflow:hidden; padding:14px 16px; text-align:left; }
    button.product-card { cursor:pointer; } button.product-card:hover { transform:translateY(-2px); box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1); }
    .product-full { grid-column:1 / -1; } .product-brief { background:var(--blush); border-left:4px solid var(--coral); } .product-pipeline { border-left:4px solid var(--coral); gap:6px; }
    .product-head { display:flex; align-items:center; gap:8px; } .product-title { flex:1; font-size:1rem; font-weight:700; } .product-arrow { color:var(--muted); font-size:.875rem; }
    .product-badge { background:var(--coral); border-radius:999px; color:#fff; font-size:.75rem; font-weight:700; padding:2px 8px; }
    .product-metric { font-size:1.25rem; font-weight:800; letter-spacing:-.025em; line-height:1.15; margin:0; } .product-description { color:var(--muted); font-size:.875rem; line-height:1.45; margin:-4px 0 2px; }
    .product-today { background:var(--blush); border-color:#f6b8ac; } .product-row { align-items:center; display:flex; gap:10px; padding:4px 0; } .product-row span:nth-child(2) { flex:1; font-size:.875rem; } .product-time { color:var(--muted); font-size:.75rem; }
    .check { width:16px; height:16px; border:2px solid var(--line); border-radius:4px; flex:none; } .priority { width:8px; height:8px; border-radius:50%; background:#eab308; flex:none; } .priority.coral { background:#f97316; }
    .product-footer { align-items:center; color:var(--muted); display:flex; font-size:.75rem; gap:10px; justify-content:space-between; margin-top:auto; padding-top:14px; } .product-footer b { color:var(--ink); }
    .product-talk { align-items:center; background:var(--color-accent); border:0; border-radius:999px; color:#fff; display:flex; font-size:.875rem; font-weight:800; justify-content:center; margin:24px auto 40px; min-height:52px; width:100%; }
    .swatches { display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; } .swatch { display:grid; gap:6px; justify-items:center; border:1px solid var(--line); border-radius:14px; padding:10px; background:var(--color-surface); color:var(--color-text-muted); font-size:.75rem; font-weight:800; cursor:pointer; transition:border-color 0.15s; } .swatch span { width:27px; height:27px; border-radius:50%; border:3px solid var(--color-surface); box-shadow:0 0 0 1px var(--color-border); } .swatch[aria-pressed="true"] { border-color:var(--color-accent); color:var(--color-text); }
    @media (min-width:768px) { .product-grid { grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr); gap:16px; } .product-card { border-radius:20px; padding:20px 24px; } .product-half { grid-column:span 1; } .product-today { grid-row:span 2; min-height:340px; } .product-review,.product-plan { min-height:160px; } .product-talk { max-width:804px; width:calc(100% - 32px); } }
    @media (max-width:800px) { .form-inner { padding:36px 25px; } .dashboard-grid, .detail-grid { grid-template-columns:1fr; } .tool-grid { grid-template-columns:repeat(2,1fr); } .plan-grid { grid-template-columns:1fr; } .topbar { padding:0 20px; } .topbar .date { display:none; } .wordmark { justify-self:start; } .page { width:min(100% - 28px, 1200px); padding-top:24px; } .card.large { min-height:190px; } }
  </style>
</head>
<body>
  <section id="login" class="login" aria-label="Sign in to OpenPip">
    <div class="login-form"><form id="login-form" class="form-inner"><div class="login-mascot"><img src="assets/logo.png" alt="OpenPip mascot" /></div><h2>OpenPip</h2><p class="login-intro"><strong>Your Personal Assistant</strong><span>Helps you with task management &amp; travel planning</span></p><label for="email">Email</label><input id="email" type="email" autocomplete="username" required value="testing@testing.com" /><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required value="testing@testing.com" /><button class="primary" type="submit">Sign in</button><p id="login-error" class="error" role="alert"></p><p class="hint">Demo workspace. No Google sign-in required.</p></form></div>
  </section>

  <main id="app" class="app">
    <header class="topbar"><span class="date">Tuesday, July 21</span><div class="wordmark"><span class="mini"><img src="assets/logo.png" alt="" /></span> OpenPip</div><button class="user" id="open-tools" aria-label="Open workspace"><span class="avatar">MC</span><span class="hide-small">Maya</span></button></header>
    <div id="page" class="page"></div>
    <button id="agent-launch" class="agent-launch"><span class="pulse"></span>Talk or Type to Pip</button>
  </main>

  <div id="assistant-modal" class="overlay" role="dialog" aria-modal="true" aria-label="Chat with Pip"><div class="modal chat"><div class="modal-head"><div class="wordmark"><span class="mini"><img src="assets/logo.png" alt="" /></span> Pip</div><button class="close" data-close="assistant-modal" aria-label="Close">×</button></div><div id="messages" class="messages"></div><form id="chat-form" class="chat-form"><button id="chat-read" class="voice" type="button" aria-label="Read Pip's last response"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button><input id="chat-input" aria-label="Message Pip" placeholder="Ask Pip anything…" autocomplete="off" maxlength="600" /><button id="chat-mic" class="voice" type="button" aria-label="Voice input"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button><button id="chat-send" class="send" aria-label="Send message">↑</button></form></div></div>
  <div id="tools-modal" class="overlay" role="dialog" aria-modal="true" aria-label="Open workspace"><div class="modal"><div class="modal-head"><h2>Your workspace</h2><button class="close" data-close="tools-modal" aria-label="Close">×</button></div><div class="mode-grid" id="tool-grid"></div></div></div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const state = { view: 'dashboard', selected: null, decisions: {}, chat: [{role:'assistant', text:'Hi Maya — I have a few items ready for your decision. You can ask me what changed today, or tell me what you want to work on.'}] };
    const items = [
      { id:'application', type:'Application draft', title:'Product Operations Manager at Lantern', summary:'Tailored application packet based on your saved background and a role that matches your goals.', action:'No application submitted', source:'A role saved from your opportunity research on July 20.', sourceView:'career', status:'Ready for your approval', detail:'Your résumé highlights operations leadership, cross-functional delivery, and customer research. Pip drafted the materials but will not submit anything without your decision.' },
      { id:'reply', type:'Email draft', title:'Reply to Rowan about the community event', summary:'A warm reply is ready for the volunteer coordinator.', action:'No message sent', source:'Email from Rowan Ellis: “Can you join the September panel?”', sourceView:'inbox', status:'Ready for your approval', detail:'Pip found a similar conversation you answered last spring and prepared a concise reply that confirms interest while asking for timing details.' },
      { id:'campaign', type:'Networking campaign', title:'Reconnect with product operators in Portland', summary:'A small, personalized outreach campaign for six people in your existing network.', action:'Campaign not scheduled', source:'Your “Portland trip” plan and three past networking conversations.', sourceView:'plans', status:'Ready for your approval', detail:'Pip has prepared six individual drafts. Approving schedules the campaign; it never sends automatically.' },
      { id:'trip', type:'Trip recommendation', title:'Compare Portland travel options', summary:'Two refundable flight and hotel combinations are ready to compare.', action:'Nothing booked', source:'Calendar event “Portland Product Community” on September 18.', sourceView:'calendar', status:'Ready for your approval', detail:'Pip organized two options around your calendar, flexible schedule, and preference for a quiet hotel. Approving opens the itinerary for a final manual booking.' }
    ];
    const modes = [
      ['dashboard','⌂','Home','Your current outcomes'], ['today','☀','Today','Tasks and calendar'], ['review','✓','Review','Your approval queue'], ['inbox','✉','Inbox','Messages and drafts'], ['plans','◇','Plans','Trips and campaigns'], ['tasks','□','Tasks','Manual task list'], ['calendar','▣','Calendar','Your time'], ['network','◎','Network','People and follow-ups'], ['notebook','▤','Notebook','Notes and insights'], ['career','↗','Opportunity research','Background research'], ['settings','⚙','Settings','Account controls']
    ];
    const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pending = () => items.filter(item => !state.decisions[item.id]);
    const itemById = id => items.find(item => item.id === id);
    function navigate(view, selected=null) { state.view=view; state.selected=selected; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    function card(view, label, count, description, large=false, extras='') { return `<button class="card ${large?'large':''}" data-nav="${view}"><span class="arrow">→</span><span class="badge">${count}</span><h3>${label}</h3><p>${description}</p>${extras}</button>`; }
    function renderDashboard() { const p=pending(); return `<div class="product-grid"><section class="product-card product-full product-brief"><div class="product-head"><span class="product-title">Today’s Brief</span><button class="tts" data-read="Today you have a team planning session, three prepared tasks, and ${p.length} choices that need your approval." aria-label="Read today's brief">♬</button></div><p style="margin:0;font-size:.875rem;line-height:1.6">Pip cleared the small things and found a few decisions worth your attention.</p><ul style="margin:0;padding-left:18px;font-size:.875rem;line-height:1.6"><li>Team planning at 10:30 AM</li><li>Two messages have drafts ready</li><li>${p.length} agent-prepared choices are waiting for you</li></ul></section><section class="product-card product-full product-pipeline" style="background:var(--color-surface)" aria-live="polite"><div class="product-head"><span class="product-title">Pip is working</span><span class="pipelinePulse" aria-hidden="true"></span></div><p class="pipelineText">Reviewing the next useful context for you</p><p class="pipelineMeta">Pip will add a proposal only when there is something that needs your decision.</p></section><button class="product-card product-half product-today" data-nav="today"><div class="product-head"><span class="product-title">Today</span><span class="product-badge">3 open</span><span class="product-arrow">→</span></div><p class="product-metric">1 event · 3 tasks</p><p class="product-description">Your commitments and tasks Pip prepared for today.</p><div class="product-row"><span class="dot"></span><span>Team planning</span><span class="product-time">10:30 AM</span></div><div class="product-row"><span class="check"></span><span>Send venue shortlist</span><span class="priority"></span></div><div class="product-row"><span class="check"></span><span>Call Mom</span><span class="priority coral"></span></div></button><button class="product-card product-half product-review" data-nav="review"><div class="product-head"><span class="product-title">Ready for review</span><span class="product-badge">${p.length} waiting</span><span class="product-arrow">→</span></div><p class="product-metric">${p.length} items</p><p class="product-description">Drafts, applications, and proposals waiting for your decision.</p><div class="product-footer"><span style="color:var(--color-accent)">These need your approval</span></div></button><button class="product-card product-half product-plan" data-nav="plans"><div class="product-head"><span class="product-title">Trip planning</span><span class="product-arrow">→</span></div><p class="product-metric">Portland</p><p class="product-description">Two refundable options are ready to compare.</p><div class="product-footer"><span>Saved plan</span></div></button></div><button class="product-talk" data-open-agent>◉&nbsp; Talk or Type to Pip</button>`; }
    function renderReview() { const p=pending(); return `<button class="back" data-nav="dashboard">← Back home</button><div class="eyebrow">Your decisions</div><h1>Ready for review</h1><p class="sub">Pip prepares work from your connected context. Nothing external happens until you approve it.</p>${p.length ? `<section class="card list-card">${p.map(i=>`<button class="row" data-detail="${i.id}"><span class="initial">${i.type[0]}</span><span class="row-main"><span class="row-title">${esc(i.title)} <span class="badge">${esc(i.type)}</span></span><span class="row-sub">${esc(i.summary)}</span></span><span class="row-right">${esc(i.action)}<br>→</span></button>`).join('')}</section>` : `<div class="empty"><strong>You’re all caught up.</strong><br>New proposals will appear here when Pip finds something that needs your decision.</div>`}`; }
    function renderDetail() { const i=itemById(state.selected); if(!i) return renderReview(); const decision=state.decisions[i.id]; return `<button class="back" data-nav="review">← Review queue</button><div class="eyebrow">${esc(i.type)}</div><h1>${esc(i.title)}</h1><p class="sub">${decision ? `You ${decision} this item.` : i.status}</p><div class="detail-grid"><div><section class="section"><h2>What Pip prepared</h2><p>${esc(i.detail)}</p><div class="fact"><span>External action</span><strong>${decision === 'approved' ? (i.id==='campaign' ? 'Scheduled — no messages sent yet' : 'Your approval recorded') : decision === 'rejected' ? 'No external action' : i.action}</strong></div><div class="fact"><span>Next step</span><strong>${decision ? 'Saved in your workspace' : 'Your decision'}</strong></div></section><section class="section" style="margin-top:18px"><h2>Why this was prepared</h2><p>Pip used the source below together with the context you have already saved in OpenPip. It does not infer an action from a single item alone.</p><button class="source-link" data-nav="${i.sourceView}">Open source context →<br><small>${esc(i.source)}</small></button></section>${!decision?`<div class="approval"><button class="secondary" data-decision="reject">Reject</button><button class="primary" data-decision="approve">Approve ${i.type.toLowerCase()}</button></div>`:`<div class="notice">${decision==='approved'?'Approved and recorded.':'Rejected. No external action was taken.'}</div>`}</div><aside class="section"><h2>Safety check</h2><div class="fact"><span>Proposed by</span><strong>Pip</strong></div><div class="fact"><span>Based on</span><strong>Saved context</strong></div><div class="fact"><span>Sent or submitted</span><strong>${decision==='approved' && i.id==='campaign'?'Scheduled only':'No'}</strong></div></aside></div>`; }
    function renderToday() { return `<button class="back" data-nav="dashboard">← Back home</button><div class="eyebrow">Tuesday, July 21</div><h1>Today</h1><p class="sub">The things you chose to do, with the context Pip prepared.</p><section class="card list-card"><div class="row"><span class="dot"></span><span class="row-main"><span class="row-title">Team planning</span><span class="row-sub">Weekly planning · Northstar room</span></span><span class="row-right">10:30 AM</span></div><div class="row"><span class="dot gold"></span><span class="row-main"><span class="row-title">Send venue shortlist</span><span class="row-sub">Pip found three options from your notes</span></span><span class="row-right">Local task</span></div><div class="row"><span class="dot mint"></span><span class="row-main"><span class="row-title">Call Mom</span><span class="row-sub">Personal reminder</span></span><span class="row-right">6:00 PM</span></div></section>`; }
    function renderInbox() { return `<button class="back" data-nav="dashboard">← Back home</button><div class="eyebrow">Your messages</div><h1>Inbox</h1><p class="sub">Pip has organized the messages that need attention. Nothing is automatically sent.</p><section class="card list-card"><button class="row" data-detail="reply"><span class="initial">R</span><span class="row-main"><span class="row-title">Rowan Ellis <span class="badge">Draft ready</span></span><span class="row-sub">September community panel</span></span><span class="row-right">9:18 AM<br>→</span></button><button class="row"><span class="initial">L</span><span class="row-main"><span class="row-title">Lantern Careers</span><span class="row-sub">Product Operations Manager · role saved to research</span></span><span class="row-right">Yesterday</span></button><button class="row"><span class="initial">P</span><span class="row-main"><span class="row-title">Portland Product Community</span><span class="row-sub">September event details</span></span><span class="row-right">Jul 19</span></button></section>`; }
    function renderPlans() { return `<button class="back" data-nav="dashboard">← Back home</button><div class="eyebrow">What is in motion</div><h1>Active plans</h1><p class="sub">Pip collects options and prepares work. You control what turns into action.</p><div class="grid plan-grid"><button class="card large" data-detail="trip"><span class="arrow">→</span><span class="badge blue">2 options ready</span><h3>Portland product trip</h3><p>Travel possibilities organized around the September community event.</p><div class="item-list"><div class="tiny-item">Sep 17–19 <span class="meta">Flexible</span></div><div class="tiny-item">Refundable options only <span class="meta">Travel</span></div></div></button><button class="card large" data-detail="campaign"><span class="arrow">→</span><span class="badge gold">Approval needed</span><h3>Portland networking</h3><p>A small, personal campaign based on your existing relationships.</p><div class="item-list"><div class="tiny-item">6 people selected <span class="meta">No send yet</span></div></div></button></div>`; }
    function renderSettings() { const active=localStorage.getItem('openpip-accent')||'coral'; const activeMode=localStorage.getItem('openpip-mode')||'system'; const colors=[['coral','#f47560'],['blue','#1877f2'],['green','#6b9e6b'],['red','#e5383b'],['lilac','#9b72cf']]; const modes=[['light','☀','Light'],['dark','◑','Dark'],['system','◐','System']]; return `<button class="back" data-nav="dashboard">← Back home</button><div class="eyebrow">Your workspace</div><h1>Settings</h1><p class="sub">Make Pip feel like yours.</p><section class="section"><h2>Theme</h2><p>Switch between light, dark, or follow your system preference.</p><div class="swatches">${modes.map(([name,icon,label])=>`<button class="swatch" data-theme-mode="${name}" aria-pressed="${activeMode===name}"><span style="font-size:1.2rem;width:auto;height:auto;border:0;box-shadow:none;border-radius:0">${icon}</span>${label}</button>`).join('')}</div></section><section class="section" style="margin-top:18px"><h2>Accent color</h2><p>Choose the color used across your workspace.</p><div class="swatches">${colors.map(([name,color])=>`<button class="swatch" data-accent="${name}" aria-pressed="${active===name}"><span style="background:${color}"></span>${name[0].toUpperCase()+name.slice(1)}</button>`).join('')}</div></section>`; }
    function renderSimple(view) { const copy={tasks:['Local tasks','Three tasks are ready when you are.'],calendar:['Calendar','Your week, with enough room to breathe.'],network:['Network','Relationships and follow-ups Pip can help you keep warm.'],notebook:['Notebook','Notes and insights you want to keep close.'],career:['Opportunity research','Pip researches roles in the background and only brings application drafts to Review.']}[view] || ['Workspace','']; return `<button class="back" data-nav="dashboard">← Back home</button><div class="eyebrow">OpenPip</div><h1>${copy[0]}</h1><p class="sub">${copy[1]}</p><section class="section"><h2>${view==='career'?'How opportunity research works':'Your workspace'}</h2><p>${view==='career'?'When Pip finds a promising role, it compares the role with your saved materials and creates a draft application in Review. It never applies automatically.':'This interactive workspace keeps the route simple while preserving the manual tools you can use any time.'}</p></section>`; }
    function render() { let content; if(state.view==='dashboard') content=renderDashboard(); else if(state.view==='review') content=renderReview(); else if(state.view==='detail') content=renderDetail(); else if(state.view==='today') content=renderToday(); else if(state.view==='inbox') content=renderInbox(); else if(state.view==='plans') content=renderPlans(); else if(state.view==='settings') content=renderSettings(); else content=renderSimple(state.view); document.querySelector('#page').innerHTML=content; document.querySelector('#agent-launch').style.display=state.view==='dashboard'?'none':'block'; bindPage(); }
    function bindPage() { document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.nav))); document.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('click',()=>navigate('detail',el.dataset.detail))); document.querySelectorAll('[data-decision]').forEach(el=>el.addEventListener('click',()=>{ state.decisions[state.selected]=el.dataset.decision==='approve'?'approved':'rejected'; notify(el.dataset.decision==='approve'?'Your decision was recorded.':'No external action was taken.'); render(); })); document.querySelectorAll('[data-read]').forEach(el=>el.addEventListener('click',()=>readText(el.dataset.read))); document.querySelectorAll('[data-open-agent]').forEach(el=>el.addEventListener('click',()=>openModal('assistant-modal'))); document.querySelectorAll('[data-accent]').forEach(el=>el.addEventListener('click',()=>{ const name=el.dataset.accent; document.documentElement.setAttribute('data-accent',name); localStorage.setItem('openpip-accent',name); render(); })); document.querySelectorAll('[data-theme-mode]').forEach(el=>el.addEventListener('click',()=>{ const m=el.dataset.themeMode; localStorage.setItem('openpip-mode',m); const isDark=m==='system'?window.matchMedia('(prefers-color-scheme:dark)').matches:m==='dark'; document.documentElement.setAttribute('data-theme',isDark?'dark':'light'); render(); })); }
    function notify(message) { const t=document.querySelector('#toast'); t.textContent=message; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
    function openModal(id) { document.querySelector('#'+id).classList.add('open'); if(id==='assistant-modal') renderChat(); }
    function closeModal(id) { document.querySelector('#'+id).classList.remove('open'); }
    document.querySelector('#login-form').addEventListener('submit',event=>{ event.preventDefault(); const email=document.querySelector('#email').value.trim().toLowerCase(), password=document.querySelector('#password').value; const error=document.querySelector('#login-error'); if(email==='testing@testing.com' && password==='testing@testing.com') { sessionStorage.setItem('openpip-signed-in','yes'); document.querySelector('#login').style.display='none'; document.querySelector('#app').style.display='block'; render(); } else error.textContent='Use the shared test email and password to enter OpenPip.'; });
    document.querySelector('#agent-launch').addEventListener('click',()=>openModal('assistant-modal')); document.querySelector('#open-tools').addEventListener('click',()=>openModal('tools-modal')); document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeModal(el.dataset.close))); document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el) closeModal(el.id);}));
    document.querySelector('#tool-grid').innerHTML=modes.map(([id,icon,title,desc])=>`<button class="card tool-card" data-mode="${id}"><span class="icon">${icon}</span><h2>${title}</h2><p>${desc}</p></button>`).join(''); document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{ closeModal('tools-modal'); navigate(el.dataset.mode); }));
    const cannedAssistantReply = 'Thanks for trying OpenPip. This demo shows the workflow; in the full workspace, Pip can prepare actions—including appointment calls—for your approval.';
    function renderChat() { const area=document.querySelector('#messages'); area.innerHTML=state.chat.map(m=>`<div class="bubble ${m.role==='user'?'me':''}">${esc(m.text)}</div>`).join(''); area.scrollTop=area.scrollHeight; }
    function sendChat(text) { const value=text.trim(); if(!value) return; state.chat.push({role:'user',text:value},{role:'assistant',text:cannedAssistantReply}); renderChat(); }
    document.querySelector('#chat-form').addEventListener('submit',event=>{ event.preventDefault(); const input=document.querySelector('#chat-input'); sendChat(input.value); input.value=''; });
    document.querySelector('#chat-read').addEventListener('click',()=>{ const last=[...state.chat].reverse().find(message=>message.role==='assistant'); if(last) readText(last.text); });
    document.querySelector('#chat-mic').addEventListener('click',startBrowserDictation);
    function startBrowserDictation() { const SpeechRecognition=globalThis.SpeechRecognition||globalThis.webkitSpeechRecognition; const mic=document.querySelector('#chat-mic'); if(!SpeechRecognition) { notify('Voice input is unavailable in this browser.'); return; } const recognition=new SpeechRecognition(); recognition.lang=navigator.language||'en-US'; recognition.interimResults=false; recognition.maxAlternatives=1; mic.disabled=true; mic.setAttribute('aria-label','Listening for voice input'); recognition.onresult=event=>{ document.querySelector('#chat-input').value=event.results[0][0].transcript; notify('Transcription complete. You can send it now.'); }; recognition.onerror=()=>{ notify('Voice input could not be completed in this browser.'); }; recognition.onend=()=>{ mic.disabled=false; mic.setAttribute('aria-label','Voice input'); }; try { recognition.start(); } catch { mic.disabled=false; mic.setAttribute('aria-label','Voice input'); notify('Voice input could not be started in this browser.'); } }
    function readText(text) { if(!('speechSynthesis' in window)) return notify('Text-to-speech is unavailable in this browser.'); window.speechSynthesis.cancel(); const utterance=new SpeechSynthesisUtterance(text); const voice=window.speechSynthesis.getVoices().find(v=>/Samantha|Ava|Google US English/i.test(v.name)); if(voice) utterance.voice=voice; window.speechSynthesis.speak(utterance); notify('Reading today’s brief.'); }
    const savedAccent=localStorage.getItem('openpip-accent'); if(savedAccent) document.documentElement.setAttribute('data-accent',savedAccent);
    if(sessionStorage.getItem('openpip-signed-in')==='yes') { document.querySelector('#login').style.display='none'; document.querySelector('#app').style.display='block'; render(); }
  </script>
</body>
</html>
