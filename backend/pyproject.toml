[project]
name = "openpip-backend"
version = "0.1.0"
description = "OpenPip professional agent backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "strands-agents>=1.0.0",
  "boto3>=1.35.0",
  "cryptography>=42.0.0",
  "pyjwt>=2.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
